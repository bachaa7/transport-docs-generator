# =====================================================================
#  КАРТА ПОЛЕЙ ЗНП  (Заказ на поставку Альфа, .xlsm)
# =====================================================================
# Это «шаблон» для ЗНП. Метки {{ }} в файл Альфа не вставить (файл чужой и
# приходит новый каждый раз), поэтому вместо них — эта карта: что заполнять
# и как найти ячейку.
#
# Бот заполняет ТОЛЬКО перечисленные поля (жёлтые ячейки). Он НЕ трогает:
#   - продукцию и объём (строки «Наименование продукции») — их ставит Альфа;
#   - «Итого» M24 — это формула =SUM, считается сама;
#   - подпись и «место для печати» — ставятся при печати/вручную.
#
# КАК КОД НАХОДИТ ЯЧЕЙКУ (важно):
#   не по фиксированному адресу (он «плывёт» — у разных заказов разное число
#   строк продукции), а по ПОДПИСИ в колонке A (anchor) + по ЖЁЛТОЙ заливке.
#   Проверено на двух файлах Альфа: нижние поля у них в разных ячейках
#   (I29/F27 и I27/F25) — карта нашла верно в обоих.
#
# Поля:
#   anchor    — подстрока подписи в колонке A, по ней ищем нужную СТРОКУ.
#   pick      — какую жёлтую ячейку строки брать: first (первая) / last (последняя).
#   istochnik — откуда значение:
#                 voditel.*  — единый блок «водитель/ТС» (тот же, что в заявке/доверенности);
#                 reys.*     — данные рейса (вводит менеджер / дата);
#                 vygruzka.* — справочник точек выгрузки;
#                 const:...  — константа.
#
# Менять без кода: Альфа поправит форму — правим anchor/pick здесь, программу не трогаем.
# =====================================================================

list_formy: "Заявка на поставку"
zheltyy_cvet: "FFFF00"          # цвет заполняемых ячеек

polya:

  - id: fio_voditelya
    anchor: "Ф.И.О. лица, который будет принимать груз"
    pick: first
    istochnik: "voditel.fio"

  - id: telefon_voditelya
    anchor: "Ф.И.О. лица, который будет принимать груз"
    pick: last
    istochnik: "voditel.telefon"

  - id: pasport
    anchor: "Паспортные данные представителя"
    pick: first
    istochnik: "voditel.pasport"

  - id: avto_pricep
    anchor: "Марка, номер авто и прицепа"
    pick: first
    istochnik: "voditel.avto + ' / ' + voditel.pricep"

  - id: adres_vygruzki
    anchor: "Адрес доставки/разгрузки"
    pick: first
    istochnik: "vygruzka.adres"

  - id: data_otgruzki
    anchor: "Дата отгрузки"
    pick: first
    istochnik: "reys.data_otgruzki"

  - id: vremya_priezda
    anchor: "Время приезда авто"
    pick: first
    istochnik: "reys.vremya_priezda"

  - id: data_sozdaniya
    anchor: "Дата и время создания документа"
    pick: first
    istochnik: "reys.data_sozdaniya"

  - id: otvetstvennoe_lico
    anchor: "Ответственное лицо со стороны клиента"
    pick: first
    istochnik: "reys.otvetstvennoe"   # выбранный контакт выгрузки (п.14 формы), не хардкод Ивана

  - id: rasshifrovka_podpisi
    anchor: "Расшифровка подписи"
    pick: first
    istochnik: "const:Иванов И.И."

# НЕ заполняется ботом (для справки):
#   - Наименование продукции (строки 18+)   — Альфа
#   - Объём поставки                          — Альфа
#   - Итого (M24, формула =SUM)               — считается само
#   - Подпись / место для печати              — вручную при печати
