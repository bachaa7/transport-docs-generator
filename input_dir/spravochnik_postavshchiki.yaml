# =====================================================================
#  СПРАВОЧНИК ПОСТАВЩИКОВ (реквизиты)
# =====================================================================
# ДЕМО-ДАННЫЕ: все компании, договоры и ФИО вымышлены.
#
# Маппинг в шаблоны:
#   доверенность:  postavshchik.nazvanie  <- nazvanie
#                  osnovanie              <- osnovanie
#   гар. письмо:   postavshchik.nazvanie  <- nazvanie
#                  postavshchik.direktor_dat <- direktor_dat
#
# skladskoy_dokument — какой документ идёт на склад поставщика:
#   znp    = ЗНП (форма «Заказ на поставку», Excel) — вместо доверенности
#   garant = гарантийное письмо (дополнительно к доверенности)
#   net    = ничего сверх доверенности
#   (заявка на перевозку делается ВСЕГДА)
#
# Значения:
#   "___"  = данных нет, заполнить вручную / из учётной системы.
#   ""     = поле неприменимо (см. primechanie).
# Структура: одна запись на поставщика. Можно дополнять вручную или заменить выгрузкой из 1С.
# =====================================================================

postavshchiki:

  alfa:
    nazvanie: "ООО «ТД Альфа-Металл»"
    osnovanie: "Договор № А-001 от 10.01.2026"
    direktor_dat: ""                       # не нужен (идёт по ЗНП, не по гар. письму)
    skladskoy_dokument: "znp"
    primechanie: "Поставщик присылает свой бланк «Заказ на поставку» — сервис заполняет его по карте полей."

  beta:
    nazvanie: "ООО «Бета Трубный завод»"
    osnovanie: "Договор № Б-17/26 от 15.01.2026"
    direktor_dat: "Смирновой Елене Викторовне"
    skladskoy_dokument: "garant"
    primechanie: "Требует гарантийное письмо на каждую отгрузку."

  gamma:
    nazvanie: "ООО «Гамма-Сталь»"
    osnovanie: "Договор № Г-2026/05 от 01.02.2026"
    direktor_dat: ""
    skladskoy_dokument: "net"
    primechanie: ""

  delta:
    nazvanie: "ООО «Дельта-Металл»"
    osnovanie: "___"                       # № договора неизвестен — пример незаполненного поля
    direktor_dat: ""
    skladskoy_dokument: "net"
    primechanie: "Номер договора уточнить в учётной системе."
